<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub Studio</title>
    <link rel="stylesheet" href="./static/style.css">
    
    <!-- Secure global Supabase script bundle -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="app-container">
        <h1>Welcome to My Apps</h1>

        <!-- SYSTEM NOTIFICATION BANNER -->
        <div id="alert-banner" class="alert-banner" style="display: none;"></div>

        <!-- 1. AUTHENTICATION SECTION (Logged Out) -->
        <div id="auth-container" class="card">
            <!-- Login Form -->
            <div id="login-form">
                <h3>Login to Your Account</h3>
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button id="btn-login" class="btn-primary">Log In</button>
                <p class="toggle-text">Don't have an account? <a href="#" id="link-show-signup">Sign up here</a></p>
            </div>

            <!-- Signup Form (Hidden by default) -->
            <div id="signup-form" style="display: none;">
                <h3>Create Free Account</h3>
                <div class="input-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password (min 6 characters)</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" placeholder="••••••••" required>
                </div>
                <button id="btn-signup" class="btn-primary">Sign Up</button>
                <p class="toggle-text">Already have an account? <a href="#" id="link-show-login">Log in here</a></p>
            </div>
        </div>

        <!-- 2. PROTECTED HUB DASHBOARD (Logged In) -->
        <div id="dashboard-container" class="card" style="display: none;">
            <h3>Your App Dashboard</h3>
            <p class="welcome-banner">Welcome back, <strong id="user-display-name">User</strong>!</p>
            <p class="account-meta">Account Email: <span id="user-display-email"></span></p>
            
            <nav class="project-navigation">
                <h4>Your Microservices</h4>
                <ul id="project-links-list">
                    <!-- 
                      PRO-TIP: To add a new webapp, just add a new list item here!
                      Ensure it has 'data-secure-link="true"' so JavaScript intercepts it.
                    -->
                    <li>
                        <a href="https://map-rasterizer.onrender.com/" data-secure-link="true" class="project-link">
                            🚀 Launch Map Rasterizer
                        </a>
                    </li>
                </ul>
            </nav>

            <button id="btn-logout" class="btn-danger">Sign Out Securely</button>
        </div>
    </div>

    <!-- Guarantees browser layout downloads before running logic -->
    <script defer src="./static/app.js"></script>
</body>
</html>
