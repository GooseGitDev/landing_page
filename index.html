    <!-- Shared Header Area Component -->
    <header>
        <div class="nav-brand">My Landing Page!</div>

    <div class="container">

        </div>

            <p style="color:#aaa;">Select a project below.</p>

                <div class="project-card">
                    <h3 style="margin-top:0; color:#00ffcc;">Project: Map Rasterizer</h3>
                    <p style="color:#888;">Multiplayer game (test) with direct API hookups.</p>
                    <!-- This link destination anchor payload gets updated dynamically by our auth module script -->
                    <a href="#" id="launch-game-link" class="btn btn-primary">Launch Instance →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE CREDENTIAL VALUES FROM DASHBOARD
        // const SUPABASE_URL = "https://supabase.co"; 
        // const SUPABASE_URL = "https://oztxnrrhbrgzzibfolmc.supabase.co/rest/v1/";
        const SUPABASE_URL = "https://oztxnrrhbrgzzibfolmc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_umgeh3s19yYT7neVpzxoKw_JQ665XFh";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isSignUpMode = false;

        // UI Element Hook Registry
        const headerEmail = document.getElementById('user-display-email');
        const logoutBtn = document.getElementById('logout-btn');
        const loggedOutPanel = document.getElementById('logged-out-panel');
        const loggedInPanel = document.getElementById('logged-in-panel');
        const authForm = document.getElementById('auth-form');
        const toggleAuthMode = document.getElementById('toggle-auth-mode');
        const authTitle = document.getElementById('auth-title');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const toggleAuthMsg = document.getElementById('toggle-auth-msg');
        const launchGameLink = document.getElementById('launch-game-link');

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                headerEmail.innerText = session.user.email;
                logoutBtn.classList.remove('hidden');
                loggedOutPanel.classList.add('hidden');
                loggedInPanel.classList.remove('hidden');

                const currentHost = window.location.hostname;
                const token = session.access_token;

                if (currentHost === "localhost" || currentHost === "127.0.0.1") {
                    // //Send the token safely via URL Hash Fragment for Local testing
                    launchGameLink.href = `http://127.0.0.1:8000/?token=${token}`;
                } else {
                    // //Send the token safely via URL Hash Fragment for Live Render
                    launchGameLink.href = `https://map-rasterizer.onrender.com/?token=${token}`;
                }
            } else {
                headerEmail.innerText = "Guest Mode Active";
                logoutBtn.classList.add('hidden');
                loggedOutPanel.classList.remove('hidden');
                loggedInPanel.classList.add('hidden');
                launchGameLink.href = "#";
            }
        });


        // Toggle Form between Login and Sign Up Actions
        toggleAuthMode.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;
            authTitle.innerText = isSignUpMode ? "Create Account" : "Account Gateway Access";
            submitAuthBtn.innerText = isSignUpMode ? "Register Account" : "Sign In";
            toggleAuthMsg.innerText = isSignUpMode ? "Already registered?" : "Need an account?";
            toggleAuthMode.innerText = isSignUpMode ? "Sign In Here" : "Sign Up Here";
        });

        // Form Submission Logic
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (isSignUpMode) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert("Registration Error: " + error.message);
                else alert("Check your email mailbox inbox for a verification validation link!");
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert("Authentication Denied: " + error.message);
            }
        });

        // Logout Event Logic
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
        });
    </script>
</body>
</html> 



</template>
